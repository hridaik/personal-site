const NF=Math.max(...P.map(p=>p.t.length)),sl=document.getElementById('sl');sl.max=NF-1;

function cm(v){return 'rgb('+Math.round(217*v+42*(1-v))+','+Math.round(80*v+70*(1-v))+','+Math.round(43*v+216*(1-v))+')';}
function draw(){const LP=P.reduce((a,b)=>b.t.length>a.t.length?b:a);document.getElementById('tl').textContent='t = '+LP.t[Math.min(cur,LP.t.length-1)].toFixed(0);const dk=dark(),ink=dk?'#e8e9eb':'#1d1f23',grid=dk?'#444':'#d5d6d8';
 P.forEach((p,i)=>{const k=Math.min(cur,p.t.length-1),c=document.getElementById('c'+i).getContext('2d');c.clearRect(0,0,360,270);const X=p.X[k];
  const mx=X.reduce((a,b)=>a+b[0],0)/X.length,my=X.reduce((a,b)=>a+b[1],0)/X.length,sc=24,ox=180-mx*sc,oy=130+my*sc,px=x=>ox+x*sc,py=y=>oy-y*sc;
  c.strokeStyle=grid;c.lineWidth=1;for(let a=0;a<X.length;a++)for(let b=a+1;b<X.length;b++){const dx=X[a][0]-X[b][0],dy=X[a][1]-X[b][1];if(dx*dx+dy*dy<2.56){c.beginPath();c.moveTo(px(X[a][0]),py(X[a][1]));c.lineTo(px(X[b][0]),py(X[b][1]));c.stroke();}}
  if(p.head[k]&&p.hinge[k]&&p.tailc[k]){c.lineWidth=2.2;c.strokeStyle='#2b8a5f';c.beginPath();c.moveTo(px(p.head[k][0]),py(p.head[k][1]));c.lineTo(px(p.hinge[k][0]),py(p.hinge[k][1]));c.stroke();c.strokeStyle='#b13a9a';c.beginPath();c.moveTo(px(p.hinge[k][0]),py(p.hinge[k][1]));c.lineTo(px(p.tailc[k][0]),py(p.tailc[k][1]));c.stroke();}
  X.forEach((x,j)=>{c.beginPath();c.arc(px(x[0]),py(x[1]),8,0,6.283);c.fillStyle=cm(p.rho[k][j]);c.fill();
   if(D.ring){const u=Math.min(1,p.ubar[k][j]/D.ubar_scale);if(u>0.02){c.lineWidth=3;c.strokeStyle='rgba(255,140,0,'+(0.25+0.75*u)+')';c.stroke();}
    if(p.lit[j]&&p.t[k]>=p.lit_on[0]&&p.t[k]<=p.lit_on[1]+8){c.lineWidth=1.5;c.strokeStyle=ink;c.setLineDash([2,2]);c.beginPath();c.arc(px(x[0]),py(x[1]),11,0,6.283);c.stroke();c.setLineDash([]);}}});
  c.fillStyle=ink;c.font='12px system-ui';const a=p.angle[k];c.fillText('tail angle '+(a===null?'—':(a>0?'+':'')+a.toFixed(0)+'°'),8,16);
  if(D.badge){const ok=p.intact[k];c.fillStyle=ok?'#2b8a5f':'#c0392b';c.fillText(ok?'body intact':'body broken',280,16);}
  const s=document.getElementById('s'+i).getContext('2d');s.clearRect(0,0,360,90);s.strokeStyle=grid;s.strokeRect(30,6,320,66);const T=p.t.length;
  const line=(arr,col)=>{s.beginPath();s.strokeStyle=col;s.lineWidth=1.6;arr.forEach((v,q)=>{const x=30+320*q/Math.max(1,T-1),y=72-66*v;if(q==0)s.moveTo(x,y);else s.lineTo(x,y);});s.stroke();};
  line(p.rho.map(r=>r.reduce((u,v)=>u+v,0)/r.length),'#2a46d8');line(p.angle.map(v=>v===null?0.5:(v+30)/60),'#b13a9a');
  s.fillStyle=dk?'#9aa0a8':'#6b7078';s.font='11px system-ui';s.fillStyle='#2a46d8';s.fillText('state',34,86);s.fillStyle='#b13a9a';s.fillText('tail angle',80,86);
  const x=30+320*k/Math.max(1,T-1);s.strokeStyle=ink;s.lineWidth=1;s.beginPath();s.moveTo(x,6);s.lineTo(x,72);s.stroke();});}
document.getElementById('leg').innerHTML='<span><i style="background:#2a46d8"></i>cell state: one end</span><span><i style="background:#d9502b"></i>cell state: the other end</span><span><u style="border-color:#2b8a5f"></u>body axis</span><span><u style="border-color:#b13a9a"></u>tail</span>'+(D.ring?'<span><i style="background:none;border:2px solid #ff8c00"></i>light damage</span><span><i style="background:none;border:1.5px dashed currentColor"></i>lit cells</span>':'');
sl.oninput=()=>{cur=+sl.value;draw();};const pb=document.getElementById('play');pb.onclick=()=>{playing=!playing;pb.textContent=playing?'Pause':'Play';if(playing)tick();};
